<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sangita!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a16;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
      overflow: hidden;
    }

    /* Canvas overlay for fireworks rockets & explosion effects */
    canvas#fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Main Content Container */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      color: #ff2e63;
      text-shadow: 0 0 15px rgba(255, 46, 99, 0.8), 0 0 30px rgba(255, 46, 99, 0.4);
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .name {
      font-size: 2.2rem;
      color: #ffd700;
      font-weight: 800;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
      margin-bottom: 15px;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.98); text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
      to { transform: scale(1.05); text-shadow: 0 0 25px rgba(255, 215, 0, 1); }
    }

    /* Glassmorphism Wishing Card */
    .wishing-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 18px 20px;
      font-size: 0.98rem;
      line-height: 1.5;
      color: #f1f1f1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    /* Cake & Candle */
    .cake-container { position: relative; width: 150px; height: 130px; margin: 10px auto 20px; }
    .plate { width: 170px; height: 10px; background: #e0e0e0; border-radius: 10px; position: absolute; bottom: 0; left: -10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .layer-bottom { width: 130px; height: 45px; background: linear-gradient(to right, #e91e63, #ff4081); border-radius: 10px 10px 0 0; position: absolute; bottom: 10px; left: 10px; }
    .layer-top { width: 95px; height: 38px; background: linear-gradient(to right, #ab47bc, #ce93d8); border-radius: 10px 10px 0 0; position: absolute; bottom: 55px; left: 27px; }
    .icing { width: 95px; height: 12px; background: #fff; border-radius: 10px 10px 4px 4px; position: absolute; bottom: 81px; left: 27px; }
    
    .candle { width: 10px; height: 28px; background: repeating-linear-gradient(45deg, #00e5ff, #00e5ff 4px, #fff 4px, #fff 8px); position: absolute; bottom: 93px; left: 70px; border-radius: 3px; }
    .flame {
      width: 14px; height: 22px; background: #ff9100; border-radius: 50% 50% 20% 20%;
      position: absolute; bottom: 121px; left: 68px;
      box-shadow: 0 0 15px #ff9100, 0 0 35px #ff3d00;
      animation: flicker 0.5s infinite alternate;
      cursor: pointer;
    }
    .flame.off { display: none; }
    
    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
      100% { transform: scale(1.15) rotate(2deg); opacity: 1; }
    }

    /* Interactive Launch Button */
    .btn {
      background: linear-gradient(45deg, #ff2e63, #ff0055);
      color: #fff; border: none; padding: 12px 28px;
      font-size: 1rem; font-weight: bold; border-radius: 30px;
      box-shadow: 0 5px 20px rgba(255, 46, 99, 0.6); cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.95); }

    /* Floating Balloons Background */
    .balloon-container {
      position: absolute; width: 100%; height: 100%;
      top: 0; left: 0; pointer-events: none; overflow: hidden; z-index: 2;
    }
    .balloon {
      width: 32px; height: 42px; background: #ff2e63; border-radius: 50%;
      position: absolute; bottom: -60px;
      opacity: 0.85; animation: floatUp 9s linear infinite;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3);
    }
    .balloon::before {
      content: ''; width: 1px; height: 45px; background: rgba(255,255,255,0.4);
      position: absolute; bottom: -45px; left: 16px;
    }
    .balloon:nth-child(1) { left: 8%; background: #ff2e63; animation-delay: 0s; }
    .balloon:nth-child(2) { left: 30%; background: #00e5ff; animation-delay: 2.5s; }
    .balloon:nth-child(3) { left: 60%; background: #ffd700; animation-delay: 5s; }
    .balloon:nth-child(4) { left: 82%; background: #76ff03; animation-delay: 1.2s; }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(-125vh) rotate(15deg); opacity: 0.1; }
    }
  </style>
</head>
<body>

  <canvas id="fireworksCanvas"></canvas>

  <div class="balloon-container">
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
  </div>

  <div class="container">
    <h1>HAPPY BIRTHDAY</h1>
    <div class="name">✨ Sangita ✨</div>

    <div class="wishing-card">
      May all your dreams come true and may this year bring you lots of happiness, success, and wonderful memories! 🎉✨
    </div>

    <div class="cake-container">
      <div class="flame" id="flame" onclick="blowOut()"></div>
      <div class="candle"></div>
      <div class="icing"></div>
      <div class="layer-top"></div>
      <div class="layer-bottom"></div>
      <div class="plate"></div>
    </div>

    <button class="btn" onclick="blowOut()">Blow Candle & Launch Rockets 🚀🎂</button>
  </div>

  <script>
    // Canvas setup for Fireworks Rockets
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let rockets = [];
    let particles = [];
    const colors = ['#ff2e63', '#00e5ff', '#ffd700', '#76ff03', '#e040fb', '#ff9100'];

    class Rocket {
      constructor() {
        this.x = Math.random() * (canvas.width - 100) + 50;
        this.y = canvas.height;
        this.targetY = Math.random() * (canvas.height * 0.4) + 100;
        this.speed = Math.random() * 4 + 7;
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        this.y -= this.speed;
        if (this.y <= this.targetY) {
          this.explode();
          return false;
        }
        return true;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();

        // Rocket Trail
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y + 12);
        ctx.strokeStyle = 'rgba(255, 200, 100, 0.6)';
        ctx.stroke();
      }

      explode() {
        for (let i = 0; i < 50; i++) {
          particles.push(new Particle(this.x, this.y, this.color));
        }
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = Math.random() * 6 + 1;
        this.friction = 0.95;
        this.gravity = 0.1;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.01;
        this.color = color;
      }

      update() {
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed + this.gravity;
        this.alpha -= this.decay;
        return this.alpha > 0;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    // Launch automated continuous firework rockets
    setInterval(() => {
      rockets.push(new Rocket());
    }, 1200);

    function blowOut() {
      const flame = document.getElementById('flame');
      if (!flame.classList.contains('off')) {
        flame.classList.add('off');
      }
      // Launch a salvo of 5 rockets at once when clicked!
      for (let i = 0; i < 5; i++) {
        setTimeout(() => rockets.push(new Rocket()), i * 200);
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(10, 10, 22, 0.2)'; // Creates motion blur trail
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      rockets = rockets.filter(rocket => {
        rocket.draw();
        return rocket.update();
      });

      particles = particles.filter(particle => {
        particle.draw();
        return particle.update();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sangita!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    h1 { 
      font-size: 2rem; 
      margin-bottom: 5px; 
      color: #ff2e63; 
      text-shadow: 0 0 10px rgba(255,46,99,0.5); 
    }
    
    .name { 
      font-size: 1.8rem; 
      color: #ffe838; 
      font-weight: bold;
      margin-bottom: 15px;
      text-shadow: 0 0 8px rgba(255,232,56,0.6);
    }

    /* Wishing Card */
    .wishing-card {
      width: 280px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border-radius: 15px;
      padding: 20px;
      color: #fff;
      font-size: 1rem;
      line-height: 1.5;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    /* Cake & Candle */
    .cake-container { position: relative; width: 160px; height: 140px; margin: 10px auto 25px; z-index: 2; }
    .plate { width: 180px; height: 12px; background: #e0e0e0; border-radius: 10px; position: absolute; bottom: 0; left: -10px; }
    .layer-bottom { width: 140px; height: 45px; background: #f08a5d; border-radius: 10px 10px 0 0; position: absolute; bottom: 12px; left: 10px; }
    .layer-top { width: 100px; height: 40px; background: #f381a7; border-radius: 10px 10px 0 0; position: absolute; bottom: 57px; left: 30px; }
    .icing { width: 100px; height: 14px; background: #fff; border-radius: 10px 10px 5px 5px; position: absolute; bottom: 83px; left: 30px; }
    
    .candle { width: 10px; height: 30px; background: repeating-linear-gradient(45deg, #00fff5, #00fff5 4px, #fff 4px, #fff 8px); position: absolute; bottom: 97px; left: 75px; border-radius: 3px; }
    .flame {
      width: 14px; height: 22px; background: #ff9a00; border-radius: 50% 50% 20% 20%;
      position: absolute; bottom: 127px; left: 73px;
      box-shadow: 0 0 15px #ff9a00, 0 0 30px #ff1e00;
      animation: flicker 0.6s infinite alternate;
      cursor: pointer;
    }
    .flame.off { display: none; }
    
    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
      100% { transform: scale(1.15) rotate(2deg); opacity: 1; }
    }

    /* Button */
    .btn {
      background: #ff2e63; color: #fff; border: none; padding: 12px 28px;
      font-size: 1rem; font-weight: bold; border-radius: 25px;
      box-shadow: 0 5px 15px rgba(255, 46, 99, 0.4); cursor: pointer;
      transition: transform 0.2s;
      z-index: 2;
    }
    .btn:active { transform: scale(0.95); }

    /* Balloons Background */
    .balloon-container {
      position: absolute; width: 100%; height: 100%;
      top: 0; left: 0; pointer-events: none; overflow: hidden; z-index: 1;
    }
    .balloon {
      width: 35px; height: 45px; background: #ff2e63; border-radius: 50%;
      position: absolute; bottom: -60px;
      opacity: 0.8; animation: floatUp 8s linear infinite;
    }
    .balloon::before {
      content: ''; width: 1px; height: 50px; background: rgba(255,255,255,0.4);
      position: absolute; bottom: -50px; left: 17px;
    }
    .balloon:nth-child(1) { left: 10%; background: #ff2e63; animation-delay: 0s; }
    .balloon:nth-child(2) { left: 35%; background: #00fff5; animation-delay: 2.5s; }
    .balloon:nth-child(3) { left: 65%; background: #ffe838; animation-delay: 5s; }
    .balloon:nth-child(4) { left: 85%; background: #ff9a00; animation-delay: 1.5s; }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0.8; }
      100% { transform: translateY(-125vh); opacity: 0.1; }
    }

    /* Confetti Canvas */
    canvas#confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <!-- Floating Balloons -->
  <div class="balloon-container">
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
  </div>

  <h1>HAPPY BIRTHDAY</h1>
  <div class="name">✨ Sangita ✨</div>

  <!-- Personalized Wishing Card -->
  <div class="wishing-card">
    May all your dreams come true and may this year bring you lots of happiness, success, and wonderful memories. 🎉✨
  </div>

  <!-- Cake & Candle -->
  <div class="cake-container">
    <div class="flame" id="flame" onclick="blowOut()"></div>
    <div class="candle"></div>
    <div class="icing"></div>
    <div class="layer-top"></div>
    <div class="layer-bottom"></div>
    <div class="plate"></div>
  </div>

  <button class="btn" onclick="blowOut()">Blow Out Candle 🎂</button>

  <script>
    function blowOut() {
      const flame = document.getElementById('flame');
      if (!flame.classList.contains('off')) {
        flame.classList.add('off');
        startConfetti();
      }
    }

    // Canvas Confetti Effect
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    const colors = ['#ff2e63', '#00fff5', '#ffe838', '#00adb5', '#ff9a00'];

    function startConfetti() {
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2 + 30,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.8) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: 0.25
        });
      }
      animate();
    }

    function animate() {
      if (particles.length === 0) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        if (p.y > canvas.height) particles.splice(i, 1);
      });
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
